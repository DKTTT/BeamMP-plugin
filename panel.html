<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在线玩家</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111a2b; --panel2:#16213a; --line:#22304a;
    --txt:#e2e8f0; --muted:#94a3b8; --green:#22c55e; --gold:#fbbf24;
    --gray:#94a3b8; --red:#ef4444; --blue:#3b82f6;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--txt);
    font-family:"Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* ---------- 顶部 ---------- */
  header{
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:14px 20px; display:flex; align-items:center; gap:22px; flex-wrap:wrap;
  }
  .title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--gray)}
  .dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}
  .dot.bad{background:var(--red)}

  .big{display:flex;align-items:baseline;gap:8px}
  .big .num{font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .big .lbl{font-size:12px;color:var(--muted)}

  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    font-size:12px;padding:4px 10px;border-radius:999px;
    border:1px solid var(--line);background:var(--panel2);color:var(--muted);
  }
  .chip b{color:var(--txt);font-weight:600}
  .chip.g b{color:#bbf7d0}
  .chip.y b{color:#fde68a}
  .chip.s b{color:#cbd5e1}

  .spacer{flex:1}
  .meta{font-size:11px;color:#64748b;text-align:right;line-height:1.6}

  /* ---------- 工具条 ---------- */
  .bar{
    display:flex;align-items:center;gap:10px;padding:10px 20px;
    background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  input[type=search]{
    background:#0b1220;border:1px solid var(--line);color:var(--txt);
    border-radius:6px;padding:6px 10px;font-size:12px;width:220px;font-family:inherit;
  }
  input[type=search]::placeholder{color:#475569}
  button{
    background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;
  }
  button:hover{border-color:var(--blue)}
  button.on{background:#1e3a8a;border-color:var(--blue);color:#dbeafe}

  /* ---------- 表格 ---------- */
  #wrap{flex:1;overflow:auto;min-height:0}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{
    position:sticky;top:0;z-index:1;
    background:#0f172a;color:var(--muted);font-weight:600;font-size:11px;
    text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  tbody td{padding:9px 14px;border-bottom:1px solid #1a2537;vertical-align:middle}
  tbody tr:hover{background:#152036}
  .nm{font-weight:600}
  .sub{font-size:11px;color:#64748b;margin-top:2px}

  .badge{font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid transparent;white-space:nowrap;margin-left:6px}
  .b-adm{color:#fde68a;border-color:#a16207;background:#3b2d06}
  .b-trust{color:#bbf7d0;border-color:#15803d;background:#052e16}
  .b-untrust{color:#cbd5e1;border-color:#475569;background:#1e293b}
  .b-web{color:#bfdbfe;border-color:#1d4ed8;background:#0b1e3b}

  .hwid{font-family:Consolas,monospace;font-size:11px;color:#7dd3fc;cursor:copy;white-space:nowrap}
  .hwid:hover{text-decoration:underline}
  .muted{color:#475569}

  .empty{padding:60px 20px;text-align:center;color:#64748b;font-size:13px;line-height:2}
  .empty code{background:#16213a;padding:2px 6px;border-radius:4px;color:#94a3b8}

  #banner{
    display:none;padding:9px 20px;font-size:12px;
    background:#422006;color:#fde68a;border-bottom:1px solid #a16207;
  }
  #banner.show{display:block}

  footer{
    flex:0 0 auto;padding:6px 20px;background:var(--panel);border-top:1px solid var(--line);
    font-size:11px;color:#64748b;display:flex;gap:16px;
  }
</style>
</head>
<body>

<header>
  <div class="title"><span class="dot" id="dot"></span>在线玩家</div>

  <div class="big">
    <span class="num" id="cnt">—</span>
    <span class="lbl">人在线</span>
  </div>

  <div class="chips">
    <span class="chip g">授信 <b id="c-trust">0</b></span>
    <span class="chip s">未授信 <b id="c-untrust">0</b></span>
    <span class="chip y">管理员 <b id="c-admin">0</b></span>
  </div>

  <span class="spacer"></span>
  <div class="meta">
    <div id="upd">—</div>
    <div id="api" style="font-family:Consolas,monospace"></div>
  </div>
</header>

<div id="banner"></div>

<div class="bar">
  <input type="search" id="q" placeholder="搜索名字 / 机器码 / 账号ID">
  <button data-f="all" class="on">全部</button>
  <button data-f="trusted">授信</button>
  <button data-f="untrusted">未授信</button>
  <button data-f="admin">管理员</button>
  <span class="spacer" style="flex:1"></span>
  <button id="auto" class="on">自动刷新 2s</button>
  <button id="reload">立即刷新</button>
</div>

<div id="wrap">
  <table>
    <thead>
      <tr>
        <th style="width:34%">玩家</th>
        <th style="width:16%">状态</th>
        <th style="width:16%">官方账号</th>
        <th style="width:22%">机器码</th>
        <th style="width:6%">车辆</th>
        <th style="width:6%">在线</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty" style="display:none"></div>
</div>

<footer>
  <span>数据: <code id="api2"></code></span>
  <span id="last">—</span>
  <span class="spacer" style="flex:1"></span>
  <span>在线人数 = online_players.json 里的玩家条数, 与游戏内广播一致</span>
</footer>

<script>
(function () {
  "use strict";

  var API = "/api/players/live";
  var POLL_MS = 2000;

  var S = {
    players: [],
    counts: { total: 0, trusted: 0, untrusted: 0, admin: 0 },
    stale: false,
    updatedAt: null,
    filter: "all",
    q: "",
    auto: true,
    timer: null,
    connected: false
  };

  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fmtDur(sec) {
    sec = Math.max(0, sec | 0);
    if (sec < 60) return sec + "秒";
    var m = Math.floor(sec / 60);
    if (m < 60) return m + "分";
    var h = Math.floor(m / 60);
    return h + "时" + (m % 60) + "分";
  }

  function fmtTime(ts) {
    if (!ts) return "—";
    var d = new Date(ts * 1000);
    return d.toLocaleTimeString();
  }

  /* ---------------- 渲染 ---------------- */
  function visiblePlayers() {
    var q = S.q.trim().toLowerCase();
    return S.players.filter(function (p) {
      if (S.filter === "trusted" && !p.trusted) return false;
      if (S.filter === "untrusted" && p.trusted) return false;
      if (S.filter === "admin" && !p.is_admin) return false;
      if (!q) return true;
      return (p.name || "").toLowerCase().indexOf(q) >= 0
          || (p.hwid || "").toLowerCase().indexOf(q) >= 0
          || (p.beammp_id || "").toLowerCase().indexOf(q) >= 0;
    });
  }

  function renderHeader() {
    $("cnt").textContent = S.counts.total;
    $("c-trust").textContent = S.counts.trusted;
    $("c-untrust").textContent = S.counts.untrusted;
    $("c-admin").textContent = S.counts.admin;
    $("upd").textContent = S.updatedAt ? ("数据更新 " + fmtTime(S.updatedAt)) : "尚未取到数据";

    var banner = $("banner");
    if (S.stale) {
      banner.className = "show";
      banner.textContent = "⚠ 数据已超过 30 秒没有更新 —— 可能是 BeamMP 服务器没开, 或 BMP Login 插件没加载";
    } else {
      banner.className = "";
    }
  }

  function renderRows() {
    var list = visiblePlayers();
    var tbody = $("rows");
    var empty = $("empty");
    tbody.innerHTML = "";

    if (!list.length) {
      empty.style.display = "block";
      if (!S.players.length) {
        empty.innerHTML = S.stale
          ? "当前没有在线玩家数据<br><br>如果服务器开着, 检查 <code>BMPLogin</code> 插件是否加载"
          : "服务器上当前没有玩家";
      } else {
        empty.innerHTML = "没有符合筛选条件的玩家";
      }
      return;
    }
    empty.style.display = "none";

    var html = "";
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var badges = "";
      if (p.is_admin) badges += '<span class="badge b-adm">管理员</span>';
      badges += p.trusted
        ? '<span class="badge b-trust">授信用户</span>'
        : '<span class="badge b-untrust">未授信</span>';
      if (p.web_account) {
        badges += '<span class="badge b-web">网站: ' + esc(p.web_account) + "</span>";
      }

      var hwid = p.hwid
        ? '<span class="hwid" data-hw="' + esc(p.hwid) + '" title="点击复制">' + esc(p.hwid) + "</span>"
        : '<span class="muted">未上报</span>';
      var accId = p.beammp_id
        ? '<span class="hwid" data-hw="' + esc(p.beammp_id) + '" title="点击复制">'
          + esc(p.beammp_id.length > 16 ? p.beammp_id.slice(0, 16) + "…" : p.beammp_id) + "</span>"
        : '<span class="muted">未登录</span>';

      html += "<tr>"
        + '<td><div class="nm">' + esc(p.name || ("#" + p.playerID)) + "</div>"
        + '<div class="sub">ID ' + esc(p.playerID) + "</div></td>"
        + "<td>" + badges + "</td>"
        + "<td>" + accId + "</td>"
        + "<td>" + hwid + "</td>"
        + '<td class="muted">' + (p.vehicle_count || 0) + "</td>"
        + '<td class="muted">' + fmtDur(p.online_seconds) + "</td>"
        + "</tr>";
    }
    tbody.innerHTML = html;

    var spans = tbody.querySelectorAll(".hwid");
    for (var j = 0; j < spans.length; j++) {
      spans[j].addEventListener("click", function () {
        var v = this.getAttribute("data-hw");
        try { navigator.clipboard.writeText(v); } catch (e) {}
        var old = this.textContent;
        this.textContent = "已复制 ✓";
        var self = this;
        setTimeout(function () { self.textContent = old; }, 800);
      });
    }
  }

  /* ---------------- 轮询 ---------------- */
  function setStatus(kind) {
    var d = $("dot");
    d.className = "dot " + (kind === "ok" ? "ok" : kind === "bad" ? "bad" : "");
  }

  function poll() {
    fetch(API, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.ok) throw new Error("bad payload");
        var d = j.data || {};
        S.players = d.players || [];
        S.counts = d.counts || { total: S.players.length, trusted: 0, untrusted: 0, admin: 0 };
        // 以列表长度为准, 防止 counts 和列表对不上
        if (S.counts.total !== S.players.length) S.counts.total = S.players.length;
        S.stale = !!d.stale;
        S.updatedAt = d.updated_at || null;
        S.connected = true;
        setStatus(S.stale ? "bad" : "ok");
        $("last").textContent = "最后刷新 " + new Date().toLocaleTimeString();
        renderHeader();
        renderRows();
      })
      .catch(function () {
        S.connected = false;
        setStatus("bad");
        $("last").textContent = "连接失败, 重试中…";
        var banner = $("banner");
        banner.className = "show";
        banner.textContent = "⚠ 连不上接口 " + API + " —— 检查 API 是否在跑 / 地址端口是否正确";
      });
  }

  function schedule() {
    if (S.timer) { clearInterval(S.timer); S.timer = null; }
    if (S.auto) S.timer = setInterval(poll, POLL_MS);
  }

  /* ---------------- 交互 ---------------- */
  $("q").addEventListener("input", function () {
    S.q = this.value;
    renderRows();
  });

  var fbtns = document.querySelectorAll(".bar button[data-f]");
  for (var i = 0; i < fbtns.length; i++) {
    fbtns[i].addEventListener("click", function () {
      for (var k = 0; k < fbtns.length; k++) fbtns[k].classList.remove("on");
      this.classList.add("on");
      S.filter = this.getAttribute("data-f");
      renderRows();
    });
  }

  $("reload").addEventListener("click", poll);

  $("auto").addEventListener("click", function () {
    S.auto = !S.auto;
    this.classList.toggle("on", S.auto);
    this.textContent = S.auto ? "自动刷新 2s" : "已暂停";
    schedule();
  });

  /* ---------------- 启动 ---------------- */
  $("api").textContent = API;
  $("api2").textContent = API;
  poll();
  schedule();
})();
</script>
</body>
</html>
